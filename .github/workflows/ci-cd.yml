name: CI and production deployment

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: foody-backend/pom.xml

      - name: Test and build executable JAR
        working-directory: foody-backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Stage backend artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          install -D -m 0644 foody-backend/target/foody-backend.jar release/backend/foody-backend.jar

      - name: Upload backend artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: release/backend/foody-backend.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foody-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foody-frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build same-origin production frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload frontend artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: foody-frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    environment: Production
    concurrency:
      group: foody-production
      cancel-in-progress: false
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      ARCHIVE: /var/lib/foody-deploy/incoming/foody-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
    steps:
      - name: Prepare isolated release staging
        run: |
          set -euo pipefail
          STAGING_DIR="$RUNNER_TEMP/foody-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$STAGING_DIR" in
            "$RUNNER_TEMP"/foody-[0-9]*-[0-9]*) ;;
            *) echo "Refusing unsafe staging path" >&2; exit 1 ;;
          esac
          rm -rf -- "$STAGING_DIR"
          install -d -m 0700 "$STAGING_DIR/release/backend" "$STAGING_DIR/release/frontend"
          test -d /var/lib/foody-deploy/incoming
          test -w /var/lib/foody-deploy/incoming

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/foody-${{ github.run_id }}-${{ github.run_attempt }}/release/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/foody-${{ github.run_id }}-${{ github.run_attempt }}/release/frontend

      - name: Package immutable release
        run: |
          set -euo pipefail
          STAGING_DIR="$RUNNER_TEMP/foody-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -s "$STAGING_DIR/release/backend/foody-backend.jar"
          test -s "$STAGING_DIR/release/frontend/index.html"
          tar --create --gzip --file "$STAGING_DIR/foody-release.tar.gz" \
            -C "$STAGING_DIR/release" backend frontend
          rm -f -- "$ARCHIVE.part"
          test ! -e "$ARCHIVE"
          install -m 0600 "$STAGING_DIR/foody-release.tar.gz" "$ARCHIVE.part"
          mv -T "$ARCHIVE.part" "$ARCHIVE"

      - name: Activate and verify release
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/foody-deploy "$RELEASE_ID" "$ARCHIVE"

      - name: Clean deployment staging
        if: always()
        run: |
          set -euo pipefail
          STAGING_DIR="$RUNNER_TEMP/foody-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f -- "$ARCHIVE" "$ARCHIVE.part"
          rm -rf -- "$STAGING_DIR"
