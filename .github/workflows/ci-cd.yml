name: CI and production deployment

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: foody-backend/pom.xml

      - name: Test and build executable JAR
        working-directory: foody-backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Stage backend artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          install -D -m 0644 foody-backend/target/foody-backend.jar release/backend/foody-backend.jar

      - name: Upload backend artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: release/backend/foody-backend.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foody-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foody-frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build same-origin production frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload frontend artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: foody-frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    concurrency:
      group: foody-production
      cancel-in-progress: false
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
      PROD_USER: ${{ vars.PROD_USER }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: release/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: release/frontend

      - name: Package immutable release
        run: |
          set -euo pipefail
          test -s release/backend/foody-backend.jar
          test -s release/frontend/index.html
          tar --create --gzip --file "foody-${RELEASE_ID}.tar.gz" -C release backend frontend

      - name: Configure pinned SSH identity
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$PROD_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PROD_USER" == "foody-deploy" ]]
          test -n "$PROD_SSH_PRIVATE_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Transfer complete release archive
        run: |
          set -euo pipefail
          remote_dir="/var/lib/foody-deploy/incoming"
          remote_archive="$remote_dir/foody-${RELEASE_ID}.tar.gz"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
            "install -d -m 0700 '$remote_dir'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "foody-${RELEASE_ID}.tar.gz" \
            "$PROD_USER@$PROD_HOST:$remote_archive.part"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
            "mv '$remote_archive.part' '$remote_archive'"

      - name: Activate and verify release
        run: |
          set -euo pipefail
          remote_archive="/var/lib/foody-deploy/incoming/foody-${RELEASE_ID}.tar.gz"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
            "sudo /usr/local/sbin/foody-deploy '$RELEASE_ID' '$remote_archive'"
