spring:
  application:
    name: foody-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:tc}

  jpa:
    hibernate:
      ddl-auto: validate   # migrations own the schema; never let Hibernate change it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

foody:
  jwt:
    # 256-bit secret (base64). Override via env FOODY_JWT_SECRET in real deployments
    # (e.g. Render) — the value below is only a safe local-dev default.
    secret: ${FOODY_JWT_SECRET:Zm9vZHktcGhhc2UwLXNlY3JldC1rZXktZm9yLWhtYWMtYW5kLWFlc2VjLWtleWluZw==}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    # Comma-separated origins allowed to call the API with credentials (the frontend
    # dev server by default). Override via env FOODY_CORS_ALLOWED_ORIGINS in deployments.
    allowed-origins: ${FOODY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # Local-disk folder for uploaded images (profile pictures, business covers later).
    # Override via env FOODY_UPLOAD_DIR in real deployments (should be a persistent volume).
    upload-dir: ${FOODY_UPLOAD_DIR:./uploads}

---
# Default dev profile: real MariaDB/MySQL reached via env-overridable props.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/foody?createDatabaseIfNotExist=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:foody}
    password: ${DB_PASSWORD:foody}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
# Production profile (Render, etc). All values come from environment variables —
# set SPRING_PROFILES_ACTIVE=prod on the host.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # sslMode=REQUIRED: encrypts the connection without needing a downloaded CA cert —
    # good enough for a demo. Aiven (and most managed MySQL) require an encrypted connection.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&sslMode=REQUIRED
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
# Testcontainers profile (default). Spins up a real MySQL via Docker — no manual DB setup.
spring:
  config:
    activate:
      on-profile: tc
  datasource:
    # These placeholders are replaced at runtime by AbstractContainerBaseTest.
    # Defined here only so Spring has a value while the context is prepared;
    # the @ServiceConnection / dynamic properties override them.
    url: jdbc:mysql://localhost:3306/foody?createDatabaseIfNotExist=true
    username: foody
    password: foody
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    org.hibernate.SQL: debug
    com.foody: debug
